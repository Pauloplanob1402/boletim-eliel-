# Mantém o projeto Supabase (plano gratuito) ativo: faz uma consulta simples a cada 3 dias.
# Precisa de dois "secrets" no GitHub: SUPABASE_URL e SUPABASE_ANON_KEY (veja o README).
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */3 * *"   # a cada 3 dias, 8h UTC
  workflow_dispatch:         # permite rodar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf --max-time 20 "$URL/rest/v1/keep_alive?select=id&limit=1" -H "apikey: $KEY"
